# Supabase `cars` -> Instagram poster.
#
# Targets 4pm Kosovo time (~14:00-16:00 UTC depending on CEST/CET), but
# does NOT rely on any single cron tick landing. GitHub's own docs
# acknowledge scheduled workflows "can be delayed" under load and, in
# practice, can be dropped outright some days with no run at all —
# confirmed twice against this exact workflow (2026-08-27 with the
# original "0 14 * * *", then again on 2026-08-28 with an off-the-hour
# "5 14 * * *" — neither guarantee actually fired that day).
#
# Instead this fires six times across a 14:00-15:59 UTC window (every ~20
# min) and relies on the poster script's own idempotency guard
# (hasPostedToday() in post-to-instagram.js) to make every tick except
# the first a safe no-op — it only actually posts once the DB shows
# nothing posted yet today. As long as at least one of the six ticks
# lands, the day's batch goes out; losing five out of six would need to
# happen for this to miss a day entirely.
#
# Posts up to IG_POSTS_PER_RUN *unposted* listings (default 5), so a
# scraper sync dropping thousands of rows never translates into a flood
# of IG posts. Independent of the scraper's own schedule (scraper.yml) —
# whatever's unposted in the DB at trigger time gets posted, from
# whichever sync landed most recently.
#
# To enable, configure these repository secrets:
#
#   SUPABASE_URL       Supabase project URL (same one scraper.yml uses)
#   SUPABASE_KEY        service-role key (same one scraper.yml uses)
#   IG_ACCESS_TOKEN     long-lived Instagram user access token (Instagram Login,
#                       graph.instagram.com) with instagram_business_content_publish
#   IG_BUSINESS_ID       Instagram Business Account ID (the user id returned
#                       alongside the access token)
#
# Optional repository variables:
#
#   IG_POSTS_PER_RUN     cap on posts per run, default 5
#   IG_CONTACT_PHONE     default "+37744202673"
#   IG_SITE_URL           default "dreshajelitecars.com"
#   IG_TARGET_BRANDS     comma-separated cars.make values, one post per
#                        brand per run, default "BMW,Mercedes-Benz,Audi,
#                        Volkswagen,Renault"

name: Instagram post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print captions/payloads without posting or touching the DB."
        required: false
        default: "false"
      car_id:
        description: "Post one specific car id, ignoring the daily cap. Empty = normal batch run."
        required: false
        default: ""
  schedule:
    # Six attempts every ~20 min across 14:00-15:59 UTC, offset off the
    # hour — see the header comment above for why. Only the first tick
    # that actually lands does anything; the rest are idempotent no-ops
    # via hasPostedToday().
    - cron: "5,25,45 14,15 * * *"

jobs:
  post:
    name: Post unposted cars to Instagram
    runs-on: ubuntu-latest
    # POSTS_PER_RUN posts, each separated by IG_POST_STEP_DELAY_MS (default
    # 1 min) — plenty of headroom under the default 5-post/~5-minute run.
    timeout-minutes: 20
    concurrency:
      # Never run two posting jobs in parallel — they could both grab the
      # same "unposted" rows before either one's ig_posted_at write lands.
      group: instagram-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      - name: Run poster
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_POSTS_PER_RUN: ${{ vars.IG_POSTS_PER_RUN }}
          IG_CONTACT_PHONE: ${{ vars.IG_CONTACT_PHONE }}
          IG_SITE_URL: ${{ vars.IG_SITE_URL }}
          IG_TARGET_BRANDS: ${{ vars.IG_TARGET_BRANDS }}
          IG_DRY_RUN: ${{ inputs.dry_run }}
        run: node post-to-instagram.js ${{ inputs.car_id }}
