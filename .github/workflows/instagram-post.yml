# Supabase `cars` -> Instagram poster.
#
# Requirement: the daily batch posts at 18:00 Kosovo time.
#
# Two independent automatic triggers, because GitHub's cron has proven
# unreliable for this specific workflow (zero schedule deliveries
# 2026-08-27 through 2026-08-30, across three different cron rewrites,
# while scraper.yml's cron fired every day):
#
#   1. workflow_call — scraper.yml chains this after every sync, and the
#      scraper's schedule demonstrably fires daily. The poster script
#      itself enforces the 18:00 Kosovo target (see the posting window
#      section in post-to-instagram.js): the midnight sync's chained run
#      lands ~3-8am local and no-ops; the midday sync's chained run lands
#      ~13:45-15:30 local, sleeps until 18:00, then posts. Triggers
#      landing 18:00-20:59 post immediately (better late than a skipped
#      day).
#   2. The cron below — 9 ticks across 15:00-17:59 UTC — as a second
#      path in case the sync fails or finishes after 21:00 local.
#
# Every trigger is a safe no-op after the day's batch is out
# (hasPostedToday() in post-to-instagram.js), so overlapping triggers can
# never double-post; the concurrency group below serializes them.
# Manual workflow_dispatch runs bypass the window by default — a human
# clicking "post now" means now — and can also bypass the once-per-day
# guard via force_post to deliberately post an extra batch.
#
# Posts up to IG_POSTS_PER_RUN *unposted* listings (default 5), so a
# scraper sync dropping thousands of rows never translates into a flood
# of IG posts. Independent of the scraper's own schedule (scraper.yml) —
# whatever's unposted in the DB at trigger time gets posted, from
# whichever sync landed most recently.
#
# To enable, configure these repository secrets:
#
#   SUPABASE_URL       Supabase project URL (same one scraper.yml uses)
#   SUPABASE_KEY        service-role key (same one scraper.yml uses)
#   IG_ACCESS_TOKEN     long-lived Instagram user access token (Instagram Login,
#                       graph.instagram.com) with instagram_business_content_publish
#   IG_BUSINESS_ID       Instagram Business Account ID (the user id returned
#                       alongside the access token)
#
# Optional repository variables:
#
#   IG_POSTS_PER_RUN     cap on posts per run, default 5
#   IG_CONTACT_PHONE     default "+37744202673"
#   IG_SITE_URL           default "dreshajelitecars.com"
#   IG_TARGET_BRANDS     comma-separated cars.make values, one post per
#                        brand per run, default "BMW,Mercedes-Benz,Audi,
#                        Volkswagen,Renault"

name: Instagram post

on:
  workflow_call:
    # Chained after every scraper sync (see scraper.yml). Secrets are
    # passed explicitly — no `secrets: inherit` — so this job only ever
    # sees the four it needs.
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true
      IG_ACCESS_TOKEN:
        required: true
      IG_BUSINESS_ID:
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print captions/payloads without posting or touching the DB."
        required: false
        default: "false"
      car_id:
        description: "Post one specific car id, ignoring the daily cap. Empty = normal batch run."
        required: false
        default: ""
      ignore_window:
        description: "Post immediately instead of waiting for 18:00 Kosovo time."
        required: false
        default: "true"
      force_post:
        description: "Post a batch even if one already went out today (bypasses the once-per-day guard)."
        required: false
        default: "false"
  schedule:
    # 9 fallback attempts every ~20 min across 15:00-17:59 UTC — that's
    # 17:05-19:45 Kosovo time in summer (CEST) and 16:05-18:45 in winter
    # (CET), so ticks before 18:00 local wait for it and later ones post
    # immediately. Only the first trigger of the day that lands actually
    # posts; the rest are idempotent no-ops via hasPostedToday().
    - cron: "5,25,45 15,16,17 * * *"

jobs:
  post:
    name: Post unposted cars to Instagram
    runs-on: ubuntu-latest
    # The script may wait up to 5h for 18:00 Kosovo time (chained runs
    # landing 13:00-18:00 local), plus the ~10-minute posting run itself.
    # Public repo, so held runner minutes cost nothing. GitHub's hard cap
    # per job is 6h (360) — stay under it.
    timeout-minutes: 350
    concurrency:
      # Never run two posting jobs in parallel — they could both grab the
      # same "unposted" rows before either one's ig_posted_at write lands.
      group: instagram-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      - name: Run poster
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_POSTS_PER_RUN: ${{ vars.IG_POSTS_PER_RUN }}
          IG_CONTACT_PHONE: ${{ vars.IG_CONTACT_PHONE }}
          IG_SITE_URL: ${{ vars.IG_SITE_URL }}
          IG_TARGET_BRANDS: ${{ vars.IG_TARGET_BRANDS }}
          IG_DRY_RUN: ${{ inputs.dry_run }}
          # Only ever "true" for manual dispatches — schedule and
          # workflow_call leave these empty, so the window and the
          # once-per-day guard are both enforced.
          IG_IGNORE_WINDOW: ${{ inputs.ignore_window }}
          IG_FORCE_POST: ${{ inputs.force_post }}
        run: node post-to-instagram.js ${{ inputs.car_id }}
