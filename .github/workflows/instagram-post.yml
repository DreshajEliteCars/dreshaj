# Supabase `cars` -> Instagram poster.
#
# Triggers right after the *morning* scraper sync finishes (see
# scraper.yml — cron "15 */12 * * *", nominally 00:15 and 12:15 UTC, though
# scheduled runs commonly start later than the cron time under queue load),
# instead of on its own fixed clock time. That way the cars it posts always
# come from the sync that just landed, not from up to ~10h-stale data. The
# `gate` job below decides which trigger actually gets to post by parsing
# the real UTC hour the scraper run started (0-11 = morning, 12-23 =
# evening, skipped) — not a literal string match on the cron's nominal
# time, which breaks the moment a run starts even a few minutes late.
#
# This job only ever posts up to IG_POSTS_PER_RUN *unposted* listings
# (default 5), so a scraper sync dropping thousands of rows never
# translates into a flood of IG posts.
#
# To enable, configure these repository secrets:
#
#   SUPABASE_URL       Supabase project URL (same one scraper.yml uses)
#   SUPABASE_KEY        service-role key (same one scraper.yml uses)
#   IG_ACCESS_TOKEN     long-lived Instagram user access token (Instagram Login,
#                       graph.instagram.com) with instagram_business_content_publish
#   IG_BUSINESS_ID       Instagram Business Account ID (the user id returned
#                       alongside the access token)
#
# Optional repository variables:
#
#   IG_POSTS_PER_RUN     cap on posts per run, default 5
#   IG_CONTACT_PHONE     default "+383 49 845 745"
#   IG_SITE_URL           default "dreshajelitecars.com"
#   IG_TARGET_BRANDS     comma-separated cars.make values, one post per
#                        brand per run, default "BMW,Mercedes-Benz,Audi,
#                        Volkswagen,Renault"

name: Instagram post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print captions/payloads without posting or touching the DB."
        required: false
        default: "false"
      car_id:
        description: "Post one specific car id, ignoring the daily cap. Empty = normal batch run."
        required: false
        default: ""
  workflow_run:
    # Must match scraper.yml's `name:` exactly.
    workflows: ["Scraper sync"]
    types: [completed]

jobs:
  gate:
    # Decides whether this trigger should actually post, without relying on
    # the workflow_run event firing at a precise clock time — scheduled
    # GitHub Actions runs routinely start late (queue congestion can push
    # the "00:15 UTC" cron well past 01:00), so a literal string match like
    # contains(run_started_at, 'T00:') silently skips every run, including
    # the ones that were supposed to fire. This parses the actual hour
    # instead and splits the day at 12:00 UTC, which tolerates hours of
    # drift while still telling the morning sync apart from the evening one.
    name: Decide whether to post this trigger
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_post: ${{ steps.check.outputs.should_post }}
    steps:
      - name: Check trigger window
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(date -u -d "${{ github.event.workflow_run.run_started_at }}" +%H)
          # 00-11 UTC = the morning sync (whenever it actually started);
          # 12-23 UTC = the evening sync, skipped so this stays once-a-day.
          if [ "$hour" -lt 12 ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

  post:
    name: Post unposted cars to Instagram
    needs: gate
    if: needs.gate.outputs.should_post == 'true'
    runs-on: ubuntu-latest
    # POSTS_PER_RUN posts, each separated by IG_POST_STEP_DELAY_MS (default
    # 1 min) — plenty of headroom under the default 5-post/~5-minute run.
    timeout-minutes: 20
    concurrency:
      # Never run two posting jobs in parallel — they could both grab the
      # same "unposted" rows before either one's ig_posted_at write lands.
      group: instagram-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      - name: Run poster
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_POSTS_PER_RUN: ${{ vars.IG_POSTS_PER_RUN }}
          IG_CONTACT_PHONE: ${{ vars.IG_CONTACT_PHONE }}
          IG_SITE_URL: ${{ vars.IG_SITE_URL }}
          IG_TARGET_BRANDS: ${{ vars.IG_TARGET_BRANDS }}
          IG_DRY_RUN: ${{ inputs.dry_run }}
        run: node post-to-instagram.js ${{ inputs.car_id }}
